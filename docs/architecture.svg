<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" width="1100" height="790" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4527A0"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#AD1457"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="780" fill="#F5F7FA"/>

  <!-- Title -->
  <rect x="200" y="14" width="700" height="40" rx="8" fill="#DDEEFF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="550" y="39" text-anchor="middle" font-size="18" font-weight="bold" fill="#1C2E40">📧 메일 기반 업무 리포팅 자동화 AI  |  아키텍처 구성도</text>

  <!-- ===== 입력 레이어 ===== -->
  <rect x="20" y="68" width="1060" height="110" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#shadow)"/>
  <text x="36" y="88" font-size="11" font-weight="bold" fill="#1976D2">입력 레이어</text>

  <!-- .eml 파일 박스 -->
  <rect x="300" y="98" width="220" height="60" rx="8" fill="#1565C0" filter="url(#shadow)"/>
  <text x="410" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="white">📁 .eml 파일</text>
  <text x="410" y="142" text-anchor="middle" font-size="10" fill="#BBDEFB">(mail_data/)</text>

  <!-- EML 파서 박스 -->
  <rect x="580" y="98" width="180" height="60" rx="8" fill="#1976D2" filter="url(#shadow)"/>
  <text x="670" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="white">📂 EML 파서</text>
  <text x="670" y="138" text-anchor="middle" font-size="10" fill="#BBDEFB">mail_crawler.py</text>

  <!-- 입력 → 파서 화살표 -->
  <line x1="520" y1="128" x2="575" y2="128" stroke="#1565C0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="548" y="122" text-anchor="middle" font-size="9" fill="#1565C0">parse_eml_file()</text>

  <!-- ===== 핵심 처리 레이어 ===== -->
  <rect x="20" y="198" width="1060" height="220" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" filter="url(#shadow)"/>
  <text x="36" y="218" font-size="11" font-weight="bold" fill="#EF6C00">핵심 처리 레이어</text>

  <!-- 입력 → 핵심 처리 화살표 -->
  <line x1="670" y1="158" x2="430" y2="198" stroke="#1565C0" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- mail_crawler.py -->
  <rect x="40" y="224" width="210" height="88" rx="8" fill="#E65100" filter="url(#shadow)"/>
  <text x="145" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="white">mail_crawler.py</text>
  <line x1="60" y1="252" x2="230" y2="252" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <text x="145" y="266" text-anchor="middle" font-size="9.5" fill="#FFE0B2">EML 파싱 &amp; 저장</text>
  <text x="145" y="280" text-anchor="middle" font-size="9.5" fill="#FFE0B2">emails.json 관리</text>
  <text x="145" y="294" text-anchor="middle" font-size="9.5" fill="#FFE0B2">전달메일 발신자 추출</text>

  <!-- mail_classifier.py -->
  <rect x="290" y="224" width="210" height="88" rx="8" fill="#BF360C" filter="url(#shadow)"/>
  <text x="395" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="white">mail_classifier.py</text>
  <line x1="310" y1="252" x2="480" y2="252" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <text x="395" y="266" text-anchor="middle" font-size="9.5" fill="#FFCCBC">키워드 / LLM 분류</text>
  <text x="395" y="280" text-anchor="middle" font-size="9.5" fill="#FFCCBC">긴급·마감일 분석</text>
  <text x="395" y="294" text-anchor="middle" font-size="9.5" fill="#FFCCBC">우선순위 점수 산정</text>

  <!-- summary_generator.py -->
  <rect x="540" y="224" width="220" height="88" rx="8" fill="#8D1F00" filter="url(#shadow)"/>
  <text x="650" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="white">summary_generator.py</text>
  <line x1="560" y1="252" x2="740" y2="252" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <text x="650" y="266" text-anchor="middle" font-size="9.5" fill="#FFCCBC">LLM 요약 생성</text>
  <text x="650" y="280" text-anchor="middle" font-size="9.5" fill="#FFCCBC">OpenAI / Gemini / Ollama</text>
  <text x="650" y="294" text-anchor="middle" font-size="9.5" fill="#FFCCBC">일일·주간 보고서</text>

  <!-- mail_rag.py -->
  <rect x="40" y="328" width="210" height="78" rx="8" fill="#6D4C41" filter="url(#shadow)"/>
  <text x="145" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="white">mail_rag.py</text>
  <line x1="60" y1="356" x2="230" y2="356" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <text x="145" y="370" text-anchor="middle" font-size="9.5" fill="#D7CCC8">TF 임베딩 벡터 검색</text>
  <text x="145" y="384" text-anchor="middle" font-size="9.5" fill="#D7CCC8">코사인 유사도 검색</text>
  <text x="145" y="398" text-anchor="middle" font-size="9.5" fill="#D7CCC8">RAG 자연어 질의</text>

  <!-- config.py -->
  <rect x="290" y="328" width="210" height="78" rx="8" fill="#5D4037" filter="url(#shadow)"/>
  <text x="395" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="white">config.py</text>
  <line x1="310" y1="356" x2="480" y2="356" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <text x="395" y="370" text-anchor="middle" font-size="9.5" fill="#D7CCC8">SMTPConfig</text>
  <text x="395" y="384" text-anchor="middle" font-size="9.5" fill="#D7CCC8">LLMConfig  /  SchedulerConfig</text>
  <text x="395" y="398" text-anchor="middle" font-size="9.5" fill="#D7CCC8">AppConfig</text>

  <!-- crawler → classifier 화살표 -->
  <line x1="250" y1="268" x2="285" y2="268" stroke="#FF8A65" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- classifier → summary 화살표 -->
  <line x1="500" y1="268" x2="535" y2="268" stroke="#FF8A65" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 저장 레이어 ===== -->
  <rect x="20" y="440" width="270" height="220" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" filter="url(#shadow)"/>
  <text x="36" y="460" font-size="11" font-weight="bold" fill="#388E3C">저장 레이어</text>

  <!-- 핵심처리 → 저장 화살표 -->
  <line x1="145" y1="418" x2="145" y2="440" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="40" y="468" width="230" height="30" rx="6" fill="#2E7D32"/>
  <text x="155" y="488" text-anchor="middle" font-size="10" fill="white">data/emails.json</text>

  <rect x="40" y="506" width="230" height="30" rx="6" fill="#388E3C"/>
  <text x="155" y="526" text-anchor="middle" font-size="10" fill="white">data/vector_db/  (벡터 인덱스)</text>

  <rect x="40" y="544" width="230" height="30" rx="6" fill="#43A047"/>
  <text x="155" y="564" text-anchor="middle" font-size="10" fill="white">data/summaries/  (요약 파일)</text>

  <rect x="40" y="582" width="230" height="30" rx="6" fill="#66BB6A"/>
  <text x="155" y="602" text-anchor="middle" font-size="10" fill="#1A2B3C">data/weekly/  (주간 보고서)</text>

  <rect x="40" y="620" width="230" height="30" rx="6" fill="#81C784"/>
  <text x="155" y="640" text-anchor="middle" font-size="10" fill="#1A2B3C">data/by_sender/  (발신자별)</text>

  <!-- ===== 출력 레이어 ===== -->
  <rect x="320" y="440" width="760" height="200" rx="10" fill="#FCE4EC" stroke="#C2185B" stroke-width="2" filter="url(#shadow)"/>
  <text x="336" y="460" font-size="11" font-weight="bold" fill="#C2185B">출력 레이어</text>

  <!-- 핵심처리 → 출력 화살표 -->
  <line x1="650" y1="418" x2="650" y2="440" stroke="#AD1457" stroke-width="2" marker-end="url(#arrow-pink)"/>

  <!-- 저장 → dashboard 화살표 -->
  <line x1="290" y1="540" x2="340" y2="540" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- dashboard.py -->
  <rect x="350" y="468" width="310" height="150" rx="8" fill="#AD1457" filter="url(#shadow)"/>
  <text x="505" y="492" text-anchor="middle" font-size="11" font-weight="bold" fill="white">dashboard.py</text>
  <line x1="370" y1="498" x2="640" y2="498" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <text x="505" y="514" text-anchor="middle" font-size="10" fill="#FCE4EC">Streamlit 대시보드</text>
  <text x="505" y="530" text-anchor="middle" font-size="10" fill="#FCE4EC">통계·분류·발신자별 UI</text>
  <text x="505" y="546" text-anchor="middle" font-size="10" fill="#FCE4EC">RAG 검색 질의 UI</text>
  <text x="505" y="570" text-anchor="middle" font-size="9" fill="#F48FB1">▼</text>
  <rect x="380" y="578" width="250" height="26" rx="5" fill="#E91E63"/>
  <text x="505" y="596" text-anchor="middle" font-size="10" fill="white">HTML 보고서 (정적 파일)</text>

  <!-- mail_sender.py -->
  <rect x="700" y="468" width="350" height="150" rx="8" fill="#880E4F" filter="url(#shadow)"/>
  <text x="875" y="492" text-anchor="middle" font-size="11" font-weight="bold" fill="white">mail_sender.py</text>
  <line x1="720" y1="498" x2="1030" y2="498" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <text x="875" y="514" text-anchor="middle" font-size="10" fill="#F8BBD0">SMTP 주간보고서 발송</text>
  <text x="875" y="530" text-anchor="middle" font-size="10" fill="#F8BBD0">Exchange Online (포트 587)</text>
  <text x="875" y="546" text-anchor="middle" font-size="10" fill="#F8BBD0">HTML 첨부파일 지원</text>
  <text x="875" y="562" text-anchor="middle" font-size="10" fill="#F8BBD0">수신자 목록 전송</text>

  <!-- ===== 자동화 레이어 ===== -->
  <rect x="20" y="670" width="1060" height="100" rx="10" fill="#EDE7F6" stroke="#673AB7" stroke-width="2" filter="url(#shadow)"/>
  <text x="36" y="690" font-size="11" font-weight="bold" fill="#673AB7">자동화 레이어</text>

  <!-- start.bat -->
  <rect x="40" y="700" width="130" height="46" rx="8" fill="#4527A0" filter="url(#shadow)"/>
  <text x="105" y="720" text-anchor="middle" font-size="11" font-weight="bold" fill="white">start.bat</text>
  <text x="105" y="738" text-anchor="middle" font-size="9" fill="#D1C4E9">원클릭 실행</text>

  <line x1="170" y1="723" x2="210" y2="723" stroke="#4527A0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- scheduler.py -->
  <rect x="210" y="700" width="420" height="46" rx="8" fill="#512DA8" filter="url(#shadow)"/>
  <text x="420" y="717" text-anchor="middle" font-size="11" font-weight="bold" fill="white">scheduler.py  (APScheduler)</text>
  <text x="420" y="736" text-anchor="middle" font-size="9" fill="#D1C4E9">매주 월요일 09:00  →  주간 보고서 생성 + SMTP 발송</text>

  <line x1="630" y1="723" x2="680" y2="723" stroke="#512DA8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 자동화 결과 -->
  <rect x="680" y="700" width="360" height="46" rx="8" fill="#7B1FA2" filter="url(#shadow)"/>
  <text x="860" y="717" text-anchor="middle" font-size="10" font-weight="bold" fill="white">주간 보고서 생성 (LLM)</text>
  <text x="860" y="734" text-anchor="middle" font-size="9" fill="#E1BEE7">+ SMTP 발송 (mail_sender.py)</text>

  <!-- 자동화 → summary 점선 -->
  <line x1="420" y1="700" x2="650" y2="418" stroke="#9C27B0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <!-- 자동화 → mail_sender 점선 -->
  <line x1="860" y1="700" x2="875" y2="618" stroke="#9C27B0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="800" y="230" width="260" height="150" rx="8" fill="white" stroke="#CCC" stroke-width="1" opacity="0.95"/>
  <text x="930" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">범례</text>
  <rect x="820" y="264" width="18" height="14" rx="3" fill="#1565C0"/>
  <text x="845" y="276" font-size="10" fill="#333">입력</text>
  <rect x="820" y="286" width="18" height="14" rx="3" fill="#E65100"/>
  <text x="845" y="298" font-size="10" fill="#333">핵심 처리</text>
  <rect x="820" y="308" width="18" height="14" rx="3" fill="#2E7D32"/>
  <text x="845" y="320" font-size="10" fill="#333">저장</text>
  <rect x="820" y="330" width="18" height="14" rx="3" fill="#AD1457"/>
  <text x="845" y="342" font-size="10" fill="#333">출력</text>
  <rect x="820" y="352" width="18" height="14" rx="3" fill="#4527A0"/>
  <text x="845" y="364" font-size="10" fill="#333">자동화</text>
  <line x1="910" y1="264" x2="950" y2="264" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="268" font-size="10" fill="#333">데이터 흐름</text>
  <line x1="910" y1="286" x2="950" y2="286" stroke="#9C27B0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="960" y="290" font-size="10" fill="#333">자동화 트리거</text>
</svg>
