  <text x="40" y="848" font-size="10" fill="#555">• EML 가져오기 흐름 : .eml 파일 파싱 → 중복 체크 → 분류 (MailClassifier) → 긴급·마감 분석 (EmailAnalysis) → emails.json 저장</text>
